# HeartCare API - Kubernetes Deployment (Task 7)
# Runs the containerized FastAPI prediction service with readiness/liveness
# probes wired to the /health endpoint.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: heartcare-api
  labels:
    app: heartcare-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: heartcare-api
  template:
    metadata:
      labels:
        app: heartcare-api
      annotations:
        # Let Prometheus scrape the pods directly (Task 8).
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: heartcare-api
          # Replace with your pushed image, e.g. docker.io/<user>/heartcare-api:1.0.0
          image: heartcare-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
