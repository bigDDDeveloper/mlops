[flake8]
max-line-length = 100
# E402: module-level import not at top of file. Intentional in a few modules:
#   - matplotlib.use('Agg') must run before importing pyplot
#   - sys.path setup must run before importing project 'src.*' packages
# W503/W504: line-break-before/after binary operator (mutually exclusive, noisy)
extend-ignore = E402, W503, W504
exclude =
    .git,
    __pycache__,
    mlruns,
    .venv,
    venv,
    data,
    models

[tool:pytest]
testpaths = tests
python_files = test_*.py
addopts = -v
