# Prometheus scrape configuration for the HeartCare API (Task 8).
global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: heartcare-api
    metrics_path: /metrics
    static_configs:
      # 'api' is the service name in docker-compose; use host.docker.internal
      # or a pod IP when running elsewhere.
      - targets: ["api:8000"]
        labels:
          service: heartcare-api
